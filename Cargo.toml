[package]
name = "Kget"
version = "1.7.1"
edition = "2024"
description = "A powerful and versatile download manager and library"
authors = ["Davi Moreira Fuzatto <davimoreiraf@gmail.com>"]
license = "MIT"
repository = "https://github.com/davimf721/KGet"
readme = "README.md"
keywords = ["download", "http", "ftp", "sftp", "torrent"]
categories = ["network-programming", "command-line-utilities", "api-bindings"]

# Main library
[lib]
name = "kget"
path = "src/lib.rs"

# Binary CLI/GUI
[[bin]]
name = "kget"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.60", features = ["derive"] }
fs2 = "0.4.3"
humansize = "2.1.3"
indicatif = {version = "0.18.4", features = ["rayon"]}
mime = "0.3.17"
tokio = { version = "1.0", features = ["rt-multi-thread", "time", "macros", "sync"], optional = true }
rayon = "1.11.0"
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.149"
dirs = "6.0.0"
ssh2 = { version = "0.9", features = ["vendored-openssl"] }
url = "2.4"
suppaftp = "8.0.2"
socks = "0.3"
sha2 = "0.10.9"
sha1 = "0.10"
md-5 = "0.10"
blake3 = "1"
hex = "0.4"
transmission-rpc = { version = "0.5.0", optional = true }
# No transparent decompression: downloaded files must be byte-identical to the server's.
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "json", "stream", "hickory-dns", "default-tls", "socks"] }
rustyline = "17.0.2"
urlencoding = "2.1"
roxmltree = "0.20"
ctrlc = "3.4"
shlex = "1.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Credential store API; the platform stores below are enabled by the `keychain` feature
keyring-core = "1.0.1"
rpassword = "7.5.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
# Terminal UI (`kget tui`); crossterm comes re-exported as `ratatui::crossterm`
ratatui = { version = "0.30.2", optional = true }

[features]
default = ["keychain", "tui"]
# Save passwords in the OS credential store (macOS Keychain, Windows Credential
# Manager, Secret Service on Linux/BSD). Pure Rust on every platform.
keychain = [
    "dep:apple-native-keyring-store",
    "dep:windows-native-keyring-store",
    "dep:zbus-secret-service-keyring-store",
]
async = ["dep:tokio"]
# `kget tui`: full-screen terminal UI driven by the job manager. Pure Rust
# (ratatui + crossterm, no system libraries), so it is on by default.
tui = ["dep:ratatui"]
gui = ["eframe", "egui", "rfd", "arboard", "image", "egui_extras", "torrent-native", "notify-rust"]
torrent-transmission = ["transmission-rpc", "dep:tokio"]
torrent-native = ["librqbit", "dep:tokio"]

[dependencies.eframe]
version = "0.33.3"
optional = true

[dependencies.egui]
version = "0.33.3"
optional = true

[dependencies.rfd]
version = "0.17.2"
optional = true

[dependencies.arboard]
version = "3.6.1"
optional = true

[dependencies.image]
version = "0.25.9"
features = ["png", "jpeg", "ico"]
optional = true

[dependencies.egui_extras]
version = "0.33.3"
features = ["all_loaders"]
optional = true

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies.notify-rust]
version = "4.11"
optional = true

[dependencies.librqbit]
version = "8.1.1"
optional = true

[dev-dependencies]
tempfile = "3.10"
wiremock = "0.6"
tokio-test = "0.4"
tokio = { version = "1.0", features = ["full"] }
assert_cmd = "2.0"
predicates = "3.1"
hex = "0.4"
urlencoding = "2.1"
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console", "Win32_Foundation"] }
windows-native-keyring-store = { version = "1.1.0", optional = true, default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", optional = true, features = ["keychain"] }

# Secret Service over zbus with RustCrypto: no libdbus/OpenSSL, so musl and
# cross builds keep working.
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", optional = true, features = ["crypto-rust"] }
