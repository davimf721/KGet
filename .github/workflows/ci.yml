name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Never touch a real user configuration from tests
      KGET_CONFIG_DIR: ${{ github.workspace }}/.kget-test-config
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test --all-targets
      - name: Doctests
        run: cargo test --doc
      - name: Native torrent feature
        run: cargo check --features torrent-native
      - name: Transmission feature
        if: runner.os == 'Linux'
        run: cargo check --features torrent-transmission
      - name: GUI build (Linux deps)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libgtk-3-dev libdbus-1-dev
          cargo check --features gui

  macos-app:
    name: macOS app (SwiftPM)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build SwiftUI app
        run: cd macos-app && swift build -c release
